<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../src/styles.css"><title>隔离验收 · 不联网不调用真实模型</title></head><body>
<header class="app-header"><button class="icon-button mobile-menu" data-action="menu" aria-label="展开频道导航">☰</button><div class="brand"><span id="brand-icon" class="brand-icon">▤</span><div><strong id="brand-name">隔离验收</strong><span class="brand-sub">TEST ONLY · NO PAID CALLS</span></div></div><div class="header-actions"><button class="button quiet" data-action="import-new">导入文稿</button><button class="button primary" data-action="add-channel">订阅频道</button></div></header>
<div id="global-error" class="global-error" hidden></div><div class="app-body"><aside id="sidebar" class="sidebar"><div class="section-label">我的资料库</div><nav id="library-nav"></nav><div class="section-label">订阅频道</div><div id="channel-list"></div><button class="sidebar-link" data-action="channels">管理频道</button><div class="sidebar-bottom"><button id="connector-indicator" data-action="settings"></button></div></aside><main class="workspace"><section class="video-pane"><div class="video-pane-head"><h1 id="list-title"></h1><button id="sync-button" data-action="sync">刷新</button></div><div class="search-box"><input id="video-search" type="search" aria-label="搜索视频"></div><div id="list-meta"></div><div id="video-list" class="video-list"></div><div id="list-footer"></div></section><section id="reader" class="reader"></section></main></div><dialog id="app-dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog><div id="toast" class="toast" hidden></div>
<script type="module">
// 只在没有宿主 SDK 的独立子框架中加载；绝不代理真实账号或网络。
if(window.newmaxApp){document.body.textContent='检测到宿主接口，已停止隔离测试；不会调用 AI。';}
else {
const shortId='isolated-short',longId='isolated-long';
const shortText={source:'import',format:'srt',language:'中文',raw:'隔离测试正文',segments:[{start:0,end:30,text:'学习需要主动回忆，而不是重复阅读。'},{start:30,end:60,text:'间隔重复可以改善知识保持。'},{start:60,end:90,text:'用自己的话解释一个概念，能够暴露理解漏洞。'}]};
const longText={source:'import',format:'txt',language:'中文',segments:Array.from({length:180},(_,i)=>({start:i*30,end:i*30+30,text:`第${i}段，间隔重复和主动回忆是学习的方法。`+'这是一段只用于验证长文分段行为的临时资料。'.repeat(5)}))};
longText.raw=longText.segments.map(x=>x.text).join('\n');
const store=new Map([['yingdu.workspace.v1',{records:{},imports:[{id:shortId,title:'隔离验收：学习方法',channelTitle:'测试文稿',channelId:'local',local:true,url:'https://www.youtube.com/watch?v=71ya_JC_IbM',transcriptStatus:'ready'},{id:longId,title:'隔离验收：长文',channelTitle:'测试文稿',channelId:'local',local:true,url:'',transcriptStatus:'ready'},{id:'isolated-no-caption',title:'隔离验收：无字幕',channelTitle:'测试频道',channelId:'fixture-channel',url:'https://www.youtube.com/watch?v=71ya_JC_IbM',transcriptStatus:'unavailable',transcriptError:'测试响应：没有可用字幕。'}],model:'',selectedId:shortId}],['yingdu.transcript.'+shortId,shortText],['yingdu.transcript.'+longId,longText]]);
// 仅接收验收父窗口的内存样本，用于模拟重载；不访问真实 SDK 或持久资料。
const seed=window.parent!==window?window.parent.__yingduIsolatedSeed:null;
if(Array.isArray(seed)){store.clear();for(const [k,v] of seed)store.set(k,JSON.parse(JSON.stringify(v)));}
const controls=window.__harness={calls:[],failNext:false,delay:250,store,brandChange:null};
const clone=x=>x===undefined?undefined:JSON.parse(JSON.stringify(x));
window.fetch=async()=>{throw new Error('隔离测试禁止网络请求');};
window.newmaxApp={app:{getBootstrap:async()=>({name:'映读 · 隔离验收'}),onChanged:fn=>{controls.brandChange=fn;return()=>{};}},data:{get:async k=>clone(store.get(k)),set:async(k,v)=>store.set(k,clone(v)),delete:async k=>store.delete(k)},files:{readText:async()=>{throw new Error('隔离测试无连接器');}},ai:{capabilities:{outputBudget:'auto-v1',completionMetadata:true},listModels:async()=>({capabilities:controls.legacy?undefined:{outputBudget:'auto-v1',completionMetadata:true},models:[{providerId:'test-only',providerName:'隔离模拟',model:'no-billing-model'}]}),chat:async args=>{controls.calls.push(clone(args));await new Promise(r=>setTimeout(r,controls.delay));if(controls.nextResult){const result=controls.nextResult;controls.nextResult=null;return clone(result);}if(controls.failNext){controls.failNext=false;return {ok:false,error:controls.errorMessage||'隔离测试：模拟模型暂时不可用。'};}return {ok:true,termination:'stop',truncated:false,finishReason:'stop',text:args.prompt.includes('读者本次问题')?'核心是主动回忆与间隔重复。文稿在 [0:30] 提到了知识保持。':'## 一句话概览\n通过主动回忆与间隔重复提升学习质量。\n## 关键观点\n- 主动回忆比机械重读更有帮助。\n- 用自己的话解释，暴露理解漏洞。\n## 章节脉络\n[0:30] 间隔重复\n## 值得追问\n如何把这两种方法安排进日常学习？',providerId:'test-only',model:'no-billing-model'};}}};
const {attachStreamHarness}=await import('./stream-mock.mjs');
attachStreamHarness(window.newmaxApp.ai,controls);
await import('../src/app.js');
}
</script></body></html>
